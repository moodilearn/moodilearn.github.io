<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="صفحه اصلی وب‌سایت من">
  <title>صفحه اصلی</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      color: #1f2937;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, .06);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { margin: 0; color: #6b7280; line-height: 1.9; }
  </style>
</head>
<body>
  <main>
    <h1>خوش آمدید</h1>
    <p>این صفحه اصلی وب‌سایت من است.</p>
  </main>
</body>
</html>
